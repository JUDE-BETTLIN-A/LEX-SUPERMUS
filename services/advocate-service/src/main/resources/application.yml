server:
  port: 8082

spring:
  application:
    name: advocate-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lexsupermus_advocates}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Bar Council Verification API
bar-council:
  api:
    url: ${BAR_COUNCIL_API_URL:https://api.barcouncil.example.com/v1}
    key: ${BAR_COUNCIL_API_KEY:mock-api-key}
    timeout-seconds: 30
    mock-enabled: true

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.lexsupermus.advocate: DEBUG
    org.springframework.security: INFO
